<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="smartkasir_app">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>smartkasir_app</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body {
      background: linear-gradient(180deg, #1E3A8A 0%, #2563EB 100%);
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .loading-box {
      text-align: center;
    }
    .spinner {
      margin: 0 auto 20px auto;
      width: 48px;
      height: 48px;
      border: 4px solid rgba(255, 255, 255, 0.25);
      border-top-color: #F59E0B;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="loading-box" id="loading-indicator">
    <div class="spinner"></div>
    <div style="font-size: 20px; font-weight: bold; margin-bottom: 8px;">SmartKasir</div>
    <div style="font-size: 13px; opacity: 0.85;">Memuat aplikasi...</div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
